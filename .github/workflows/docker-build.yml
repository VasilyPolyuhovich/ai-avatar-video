name: Build Docker images

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  # ghcr.io requires a lowercase owner path -- hardcode rather than lowercase
  # github.repository_owner at runtime (a mixed-case value has previously
  # broken registry auth in this kind of setup, see docs/infra-notes.md).
  OWNER: vasilypolyuhovich

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: infinitetalk
            context: docker/infinitetalk
            image: ai-avatar-infinitetalk
          - name: longcat-avatar
            context: docker/longcat-avatar
            image: ai-avatar-longcat
    steps:
      - uses: actions/checkout@v4

      # CUDA devel base images run 8-9GB; the default runner disk overflows
      # without this (runpod-pod-ops skill: "free disk space" step).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ matrix.image }}:latest
            ghcr.io/${{ env.OWNER }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
